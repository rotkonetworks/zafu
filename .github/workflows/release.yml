name: Release (prod, manual)

# Production promotion. Deliberate and rare: never triggered by a push. You
# run this by hand once a beta has soaked and you're confident it's stable.
# It ships the committed manifest version (vX.Y.Z) to the prod Chrome Web
# Store listing and cuts the tagged GitHub release the README points at.
#
# Safety interlock: you must type the exact version to publish, and it must
# match the version committed in apps/extension/public/manifest.json — so a
# prod release can't fire against a stale or mismatched manifest.

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Type the version to publish to PROD, e.g. v27.3.0 (must match the committed manifest).'
        required: true
        type: string
      dry_run:
        description: 'Build + sign only. No GitHub release, no Chrome Web Store upload.'
        required: false
        default: false
        type: boolean

jobs:
  version:
    name: Verify prod version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_mode: ${{ steps.v.outputs.release_mode }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          WANT: ${{ inputs.confirm_version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -eu
          base="$(jq -r .version apps/extension/public/manifest.json)"
          if [ "${WANT#v}" != "$base" ]; then
            echo "::error::confirm_version '${WANT}' does not match committed manifest version '${base}'. Bump the manifest first, or type the right version."
            exit 1
          fi
          if [ "$DRY" = "true" ]; then mode="none"; else mode="tagged"; fi
          echo "version=v${base}" >> "$GITHUB_OUTPUT"
          echo "release_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Prod release: v${base} (mode=$mode)"

  publish:
    needs: version
    uses: ./.github/workflows/release-engine.yml
    with:
      channel: prod-only
      version: ${{ needs.version.outputs.version }}
      release_mode: ${{ needs.version.outputs.release_mode }}
    secrets: inherit
