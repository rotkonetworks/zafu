name: Publish @zafu SDK (npm, OIDC)

# Publishes the @zafu npm packages (@zafu/service, @zafu/protocol, @zafu/pq,
# @zafu/zid, @zafu/media) using Trusted Publishing (OIDC) - no long-lived token,
# no 2FA prompt, and automatic provenance. This is the durable path once npm
# removes token-based 2FA bypass (announced for 2027).
#
# PREREQUISITES (one-time, on npmjs.com, per package):
#   1. The package must already EXIST (the very first publish of a brand-new
#      name cannot use OIDC - do that one bootstrap publish manually with a
#      Classic Automation token, then this workflow owns every release after).
#      @zafu/service is the newest name and needs that bootstrap.
#   2. Package -> Settings -> Trusted Publisher -> GitHub Actions:
#        Organization/owner : rotkonetworks
#        Repository         : zafu
#        Workflow filename  : publish-zafu-sdk.yml
#      Do this for all five: @zafu/service, @zafu/protocol, @zafu/pq,
#      @zafu/zid, @zafu/media.
#   3. After OIDC is proven, flip each package to
#      "Require two-factor authentication and disallow tokens" and revoke the
#      bootstrap automation token.
#
# Deliberately manual (workflow_dispatch): a release is a decision, never a
# side effect of a push. Bump the versions together in their package.json
# files, commit, then run this.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack + validate only. No publish.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

concurrency:
  group: publish-zafu-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # uses the repo's packageManager (pnpm 9.4)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # OIDC trusted publishing needs npm >= 11.5.1; node 22 ships npm 10, so
      # pull a current npm. pnpm still does the packing (it applies each
      # package's src->dist publishConfig override and rewrites workspace:^),
      # then npm publishes the prepared tarball and performs the OIDC exchange.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @zafu/service --filter @zafu/protocol --filter @zafu/pq --filter @zafu/zid --filter @zafu/media build

      - name: Pack tarballs (applies publishConfig dist override)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          # `pnpm --filter <pkg> pack` is NOT a valid invocation: --filter implies
          # recursive mode and `pack` rejects it ("Unknown option: 'recursive'"),
          # so the whole step aborts before anything is published. Run pack via
          # exec, which cds into each package directory first.
          pnpm --filter @zafu/service  exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @zafu/protocol exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @zafu/pq       exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @zafu/zid      exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @zafu/media    exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          ls -la "$GITHUB_WORKSPACE/tarballs"

      # Publish in dependency order: service first (it is a dependency of any
      # package that composes services), then protocol + pq, then zid (depends on
      # protocol + pq), media last.
      # No NODE_AUTH_TOKEN: OIDC supplies short-lived, per-run credentials.
      - name: Publish to npm (OIDC + provenance)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for pkg in service protocol pq zid media; do
            tgz=$(ls "$GITHUB_WORKSPACE"/tarballs/zafu-${pkg}-*.tgz)
            echo "publishing $tgz"
            npm publish "$tgz" --access public --provenance
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true - packed tarballs above, nothing published."
