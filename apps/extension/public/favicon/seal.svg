<!--
  Zafu brand mark - hanko seal (秘).
  Glyph outlines extracted from Shippori Mincho SemiBold (OFL 1.1),
  https://github.com/fontdasu/ShipporiMincho, glyph uni79D8, via fontTools
  (no runtime font dependency; paths only).

  Colors: square #c73e3a (vermillion), glyph #f2ecdf (cream)
  Master ratio: glyph height = 21/38 of the square (matches the 38px/21px
  onboarding seal spec). Square corners, flat fill, no gradients or shadows.

  Rendered PNGs are tuned per size, not a plain downscale of this master:
    icon16.png  - glyph fraction 0.62, +10 font-unit stroke (upm 1000) added to bulk thin strokes
    icon32.png  - glyph fraction 0.58, +4 font-unit stroke
    icon48.png  - glyph fraction 0.57, +2 font-unit stroke
    icon128.png - 96x96 artwork (glyph fraction 0.55, no stroke boost),
                  centered in a 128x128 transparent canvas per Chrome's
                  128-icon convention.
  Regenerate by re-rendering this glyph path at the fractions above and
  adding a same-colour stroke of the listed width (font units, upm 1000)
-->
