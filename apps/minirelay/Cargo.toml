[package]
name = "minirelay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A dumb, self-hostable presence relay for zafu's private contact discovery"
repository = "https://github.com/rotkonetworks/zafu"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1